<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ShadowEncoder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d0b11"/>
      <stop offset="0.55" stop-color="#12101a"/>
      <stop offset="1" stop-color="#1b1921"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7e6fb6" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#6d5da5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6d5da5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#f2f0f8"/>
      <stop offset="0.55" stop-color="#c9bff0"/>
      <stop offset="1" stop-color="#a89ccf"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdc3f8" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#b2a2ed" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7e69d3" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- everything centered on the x=640 axis -->
  <!-- glow behind the mark -->
  <circle cx="640" cy="92" r="130" fill="url(#glow)" filter="url(#blur)"/>

  <!-- brand rays around the mark -->
  <g transform="translate(640 92)" filter="url(#blur2)">
    <rect x="-1.1" y="-104" width="2.2" height="44" rx="1" fill="url(#ray)" opacity="0.62" transform="rotate(-24)"/>
    <rect x="-1.1" y="-108" width="2.2" height="52" rx="1" fill="url(#ray)" opacity="0.42" transform="rotate(-8)"/>
    <rect x="-1.1" y="-100" width="2.2" height="38" rx="1" fill="url(#ray)" opacity="0.55" transform="rotate(12)"/>
    <rect x="-1.1" y="-110" width="2.2" height="56" rx="1" fill="url(#ray)" opacity="0.38" transform="rotate(30)"/>
    <rect x="-1.1" y="-98" width="2.2" height="36" rx="1" fill="url(#ray)" opacity="0.5" transform="rotate(-44)"/>
    <rect x="-1.1" y="-106" width="2.2" height="48" rx="1" fill="url(#ray)" opacity="0.34" transform="rotate(52)"/>
  </g>

  <!-- real app logo (inlined), zero-radius square with purple edge -->
  <g>
    <rect x="588" y="40" width="104" height="104" fill="none" stroke="#a89ccf" stroke-opacity="0.5"/>
    <image x="590" y="42" width="100" height="100" href="data:image/png;base64,"/>
  </g>

  <!-- wordmark, centered -->
  <text x="640" y="222" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="70" font-weight="700" letter-spacing="-1" fill="url(#word)">ShadowEncoder</text>

  <!-- feature chips, centered row -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600">
    <g>
      <rect x="336" y="270" width="86" height="30" fill="#1b1921" stroke="#6d5da5" stroke-opacity="0.55"/>
      <text x="379" y="290" fill="#a89ccf" text-anchor="middle">转码</text>
    </g>
    <g>
      <rect x="430" y="270" width="112" height="30" fill="#1b1921" stroke="#6d5da5" stroke-opacity="0.55"/>
      <text x="486" y="290" fill="#a89ccf" text-anchor="middle">GIF · WebP</text>
    </g>
    <g>
      <rect x="550" y="270" width="94" height="30" fill="#1b1921" stroke="#6d5da5" stroke-opacity="0.55"/>
      <text x="597" y="290" fill="#a89ccf" text-anchor="middle">透明通道</text>
    </g>
    <g>
      <rect x="652" y="270" width="98" height="30" fill="#1b1921" stroke="#6d5da5" stroke-opacity="0.55"/>
      <text x="701" y="290" fill="#a89ccf" text-anchor="middle">DIT 备份</text>
    </g>
    <g>
      <rect x="758" y="270" width="72" height="30" fill="#1b1921" stroke="#6d5da5" stroke-opacity="0.55"/>
      <text x="794" y="290" fill="#a89ccf" text-anchor="middle">流程</text>
    </g>
    <g>
      <rect x="838" y="270" width="106" height="30" fill="#1b1921" stroke="#6d5da5" stroke-opacity="0.55"/>
      <text x="891" y="290" fill="#a89ccf" text-anchor="middle">Agent CLI</text>
    </g>
  </g>

  <!-- bottom hairline -->
  <rect x="0" y="358" width="1280" height="2" fill="#6d5da5" opacity="0.5"/>
</svg>
