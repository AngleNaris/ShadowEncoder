[package]
name = "shadowencoder"
version = "2.1.0"
description = "ShadowEncoder"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[features]
custom-protocol = ["tauri/custom-protocol"]
