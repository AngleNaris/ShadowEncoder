[package]
name = "shadowencoder"
version = "2.2.0"
description = "ShadowEncoder"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/AngleNaris/shadowencoder"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
base64 = "0.22"
libc = "0.2"
gifski = { version = "1.34.0", default-features = false, features = ["gifsicle"] }
md-5 = "0.10"
shadowencoder-agent-core = { path = "../agent-core" }
shadowencoder-agent-protocol = { path = "../agent-protocol" }

[target.'cfg(target_os = "windows")'.dependencies]
# The upstream Windows build expects MPV_SOURCE/64 to contain mpv.lib and
# mpv-2.dll. app/dev-tauri.bat configures that path for local development.
libmpv2 = { version = "5", features = ["render", "build_libmpv"] }
libmpv2-sys = "4"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
# Linux and macOS use the system libmpv development package.
libmpv2 = { version = "5", features = ["render"] }
libmpv2-sys = "4"

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri/Wry already uses GTK3 on Linux. Reuse the same toolkit to host the
# libmpv OpenGL target inside the Wayland application window.
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
gl = "0.14"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
gif = "0.13"
